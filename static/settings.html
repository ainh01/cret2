<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cret2 — Cài đặt</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #12121A; color: #EDEDF5;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.5rem; margin: 0 0 24px; }
  h1 span { color: #7C4DFF; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  .hint { font-weight: 400; color: #9FA8DA; font-size: 0.85rem; margin-left: 8px; }
  input, select {
    width: 100%; padding: 11px 12px; font-size: 1rem; font-family: inherit;
    color: #EDEDF5; background: #1E1E2E;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; outline: none;
  }
  input:focus, select:focus { border-color: #7C4DFF; }
  button {
    margin-top: 22px; padding: 11px 36px;
    font-size: 1rem; font-weight: 600;
    color: #fff; background: #7C4DFF;
    border: 0; border-radius: 999px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #message { margin-top: 16px; min-height: 1.4em; }
  .ok   { color: #03DAC6; }
  .fail { color: #FF8A80; }
</style>
</head>
<body>
<main>
  <h1><span>Cret2</span> — Cài đặt</h1>

  <label for="endpoint">Đường dẫn AI</label>
  <input id="endpoint" type="text" placeholder="https://api.example.com/v1">
  <div class="hint">URL gốc tương thích OpenAI; tự nối /chat/completions nếu thiếu.</div>

  <label for="api_key">Khóa API <span class="hint" id="keyState"></span></label>
  <input id="api_key" type="password" placeholder="" autocomplete="off">

  <label for="model">Tên mô hình</label>
  <input id="model" type="text" placeholder="tên-mô-hình">

  <label for="thinking_effort">Mức suy luận</label>
  <select id="thinking_effort">
    <option value="Off">Tắt</option>
    <option value="Low">Thấp</option>
    <option value="Medium">Trung bình</option>
    <option value="High">Cao</option>
  </select>

  <br>
  <button id="save" type="button">Lưu</button>

  <p id="message"></p>
</main>

<script>
  const endpointEl = document.getElementById('endpoint');
  const apiKeyEl = document.getElementById('api_key');
  const modelEl = document.getElementById('model');
  const effortEl = document.getElementById('thinking_effort');
  const keyStateEl = document.getElementById('keyState');
  const messageEl = document.getElementById('message');
  const saveBtn = document.getElementById('save');

  function show(text, ok) {
    messageEl.textContent = text;
    messageEl.className = ok ? 'ok' : 'fail';
  }

  async function load() {
    try {
      const response = await fetch('/api/settings');
      const data = await response.json();
      endpointEl.value = data.endpoint || '';
      modelEl.value = data.model || '';
      effortEl.value = data.thinking_effort || 'Off';
      keyStateEl.textContent = data.key_set ? 'đã có khóa' : 'chưa có khóa';
      apiKeyEl.placeholder = data.key_set ? 'đã có khóa' : '';
    } catch (e) {
      show('Không tải được cài đặt.', false);
    }
  }

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    show('', true);
    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: endpointEl.value,
          api_key: apiKeyEl.value,
          model: modelEl.value,
          thinking_effort: effortEl.value,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        show(data.detail || ('Lưu thất bại (HTTP ' + response.status + ')'), false);
        return;
      }
      apiKeyEl.value = '';
      keyStateEl.textContent = 'đã có khóa';
      apiKeyEl.placeholder = 'đã có khóa';
      show('Đã lưu.', true);
    } catch (e) {
      show('Lưu thất bại: ' + e.message, false);
    } finally {
      saveBtn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
