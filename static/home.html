<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cret2 — Học</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>
<main>
  <div class="theme-bar">
    <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="true">Chế độ tối</button>
  </div>
  <h1><span>Cret2</span> — liên kết học một chạm</h1>

  <textarea id="input" placeholder="Bạn muốn học gì?"></textarea>

  <ul id="attachments" hidden></ul>

  <button id="addFiles" class="secondary" type="button">Thêm file</button>
  <input id="filePicker" type="file" multiple hidden
         accept=".pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.csv,.txt,.md,.html,.htm,.xml,.json,.epub,.ipynb,.wav,.mp3,.png,.jpg,.jpeg,.webp,.gif">

  <input id="reference" type="text" autocomplete="off" spellcheck="false" placeholder="Link tham chiếu">

  <br>
  <button id="learn" type="button">
    <span class="spinner"></span>
    <span id="learnLabel">Học</span>
  </button>

  <p id="status"></p>
  <p id="error"></p>
  <div id="link"></div>
</main>

<script src="/static/attachments.js"></script>
<script>
  const inputEl = document.getElementById('input');
  const referenceEl = document.getElementById('reference');
  const learnBtn = document.getElementById('learn');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const linkEl = document.getElementById('link');
  const addFilesBtn = document.getElementById('addFiles');
  const filePicker = document.getElementById('filePicker');
  const attachmentsEl = document.getElementById('attachments');

  // Attachments live here only: adding or removing one never touches the network.
  const store = newAttachmentStore();

  const STAGES = {
    material: 'Đang viết học liệu...',
    quiz: 'Đang viết câu hỏi...',
    interactive: 'Đang thêm phần tương tác...',
    share: 'Đang tạo liên kết...',
  };

  // ---- reference parsing (kept in sync with parse_reference() in app.py) ----
  // Accepts exactly two forms: https://vtask.fun/<code> (whitespace and a
  // trailing slash tolerated) or a bare 6-character code. Empty = no reference.
  const REFERENCE_LINK_RE = /^https:\/\/vtask\.fun\/([^?#]*)$/i;
  const REFERENCE_CODE_RE = /^[A-Za-z0-9_-]{6}$/;
  const REFERENCE_INVALID_ERROR = 'Liên kết tham chiếu không hợp lệ.';

  function parseReference(value) {
    const raw = String(value == null ? '' : value).replace(/\s+/g, '');
    if (!raw) return { code: '' };
    const match = REFERENCE_LINK_RE.exec(raw);
    let code = raw;
    if (match) {
      const segments = match[1].split('/').filter(Boolean);
      code = segments.length ? segments[segments.length - 1] : '';
    }
    if (!REFERENCE_CODE_RE.test(code)) return { error: REFERENCE_INVALID_ERROR };
    return { code: code };
  }

  function formatDetail(detail) {
    if (!detail) return '';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
      return detail.map(d => (d && (d.msg ? String(d.msg) : JSON.stringify(d))) || '').join('; ');
    }
    return String(detail);
  }

  function escapeHtml(value) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(value == null ? '' : value).replace(/[&<>"']/g, char => map[char]);
  }

  // ---- attachment list (local only) ----

  function renderAttachments() {
    attachmentsEl.hidden = store.items.length === 0;
    attachmentsEl.innerHTML = store.items.map(item => (
      '<li class="attachment">' +
        '<span class="tag">' + escapeHtml(attachmentTypeLabel(item)) + '</span>' +
        '<span class="name" title="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + '</span>' +
        '<span class="size">' + escapeHtml(attachmentSizeLabel(item)) + '</span>' +
        '<button type="button" class="remove" data-remove="' + item.id + '" title="Xóa" aria-label="Xóa">×</button>' +
      '</li>'
    )).join('');
  }

  function addItem(item) {
    const result = addAttachment(store, item);
    if (result.error) {
      errorEl.textContent = result.error;
      return null;
    }
    errorEl.textContent = '';
    renderAttachments();
    return result.item;
  }

  function addFiles(files) {
    for (const file of files) {
      addItem({
        kind: attachmentKind(file),
        name: file.name || 'tệp đính kèm',
        size: file.size || 0,
        mime: file.type || '',
        file: file,
      });
    }
  }

  addFilesBtn.addEventListener('click', () => filePicker.click());
  filePicker.addEventListener('change', () => {
    addFiles(Array.from(filePicker.files || []));
    filePicker.value = '';
  });

  attachmentsEl.addEventListener('click', (event) => {
    const button = event.target && event.target.closest ? event.target.closest('[data-remove]') : null;
    if (!button) return;
    removeAttachment(store, button.getAttribute('data-remove'));
    renderAttachments();
  });

  // Ctrl+V anywhere in the composer: a clipboard image or a lone YouTube link
  // becomes an attachment, everything else pastes into the textarea as usual.
  document.addEventListener('paste', (event) => {
    const clipboard = event.clipboardData;
    if (!clipboard) return;
    const files = Array.from(clipboard.files || []);
    const plan = planPaste(event.target && event.target.id, files, clipboard.getData('text'));
    if (plan.action === 'image') {
      event.preventDefault();
      const file = files[plan.index];
      addItem({
        kind: 'image',
        name: file.name || 'ảnh-dán.png',
        size: file.size || 0,
        mime: file.type || '',
        file: file,
      });
    } else if (plan.action === 'youtube') {
      event.preventDefault();
      addItem({ kind: 'youtube', name: plan.url, size: 0, url: plan.url });
    }
  });

  // ---- conversion (only reached from "Học") ----

  async function convertAttachment(item) {
    const form = new FormData();
    if (item.kind === 'youtube') form.append('url', item.url);
    else form.append('file', item.file, item.name);
    const response = await fetch('/api/convert', { method: 'POST', body: form });
    if (!response.ok) {
      let detail = '';
      try { detail = formatDetail((await response.json()).detail); } catch (e) {}
      throw new Error(detail || ('Lỗi máy chủ (HTTP ' + response.status + ')'));
    }
    return (await response.json()).text;
  }

  function readImageDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error('Không đọc được ảnh.'));
      reader.readAsDataURL(file);
    });
  }

  learnBtn.addEventListener('click', async () => {
    const typed = inputEl.value;
    const plan = submissionPlan(store);
    if (!typed.trim() && !plan.length) {
      errorEl.textContent = 'Hãy nhập nội dung bạn muốn học.';
      return;
    }

    const reference = parseReference(referenceEl.value);
    if (reference.error) {
      errorEl.textContent = reference.error;
      return;
    }

    errorEl.textContent = '';
    linkEl.innerHTML = '';
    statusEl.textContent = plan.length ? 'Đang chuyển đổi tệp đính kèm...' : 'Đang bắt đầu...';
    learnBtn.disabled = true;
    learnBtn.classList.add('loading');

    try {
      const sources = [];
      const images = [];
      for (const item of plan) {
        if (item.kind === 'image') {
          // Images are never converted or OCR'd: they travel to the model as-is.
          images.push({ type: 'image_url', image_url: { url: await readImageDataUrl(item.file) } });
          continue;
        }
        let text;
        try {
          text = await convertAttachment(item);
        } catch (err) {
          const label = item.kind === 'youtube' ? 'Không chuyển được video YouTube ' : 'Không chuyển được tệp ';
          throw new Error(label + '"' + item.name + '". ' + (err.message || ''));
        }
        sources.push({ name: item.name, text: text });
      }

      statusEl.textContent = 'Đang bắt đầu...';
      const payload = { input: typed };
      if (reference.code) payload.reference = reference.code;
      if (sources.length) payload.sources = sources;
      if (images.length) payload.images = images;

      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        let detail = '';
        try { detail = formatDetail((await response.json()).detail); } catch (e) {}
        throw new Error(detail || ('Lỗi máy chủ (HTTP ' + response.status + ')'));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) continue;
          let event;
          try { event = JSON.parse(line); } catch (e) { continue; }
          if (event.ping) continue;
          if (event.stage) statusEl.textContent = STAGES[event.stage] || event.stage;
          if (event.error) throw new Error(event.error);
          if (event.done) {
            statusEl.textContent = 'Xong.';
            const a = document.createElement('a');
            a.href = event.link;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = event.link;
            linkEl.innerHTML = '';
            linkEl.appendChild(a);
          }
        }
      }
    } catch (err) {
      errorEl.textContent = err.message || 'Đã xảy ra lỗi.';
      statusEl.textContent = '';
      linkEl.innerHTML = '';
    } finally {
      learnBtn.disabled = false;
      learnBtn.classList.remove('loading');
    }
  });

  renderAttachments();
</script>
</body>
</html>
