<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cret2 — Học</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #12121A; color: #EDEDF5;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  h1 span { color: #7C4DFF; }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    padding: 14px; font-size: 1rem; font-family: inherit;
    color: #EDEDF5; background: #1E1E2E;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    outline: none;
  }
  textarea:focus { border-color: #7C4DFF; }
  button {
    margin-top: 16px; padding: 12px 40px;
    font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em;
    color: #fff; background: #7C4DFF;
    border: 0; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin 0.8s linear infinite; display: none;
  }
  button.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { margin-top: 18px; min-height: 1.4em; color: #9FA8DA; }
  #error  { margin-top: 6px;  min-height: 1.4em; color: #FF8A80; }
  #link   { margin-top: 18px; min-height: 1.4em; }
  #link a {
    color: #03DAC6; font-size: 1.15rem; font-weight: 600;
    word-break: break-all;
  }
</style>
</head>
<body>
<main>
  <h1><span>Cret2</span> — liên kết học một chạm</h1>

  <textarea id="input" placeholder="Bạn muốn học gì?"></textarea>

  <br>
  <button id="learn" type="button">
    <span class="spinner"></span>
    <span id="learnLabel">Học</span>
  </button>

  <p id="status"></p>
  <p id="error"></p>
  <div id="link"></div>
</main>

<script>
  const inputEl = document.getElementById('input');
  const learnBtn = document.getElementById('learn');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const linkEl = document.getElementById('link');

  const STAGES = {
    material: 'Đang viết học liệu...',
    quiz: 'Đang viết câu hỏi...',
    interactive: 'Đang thêm phần tương tác...',
    share: 'Đang tạo liên kết...',
  };

  function formatDetail(detail) {
    if (!detail) return '';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
      return detail.map(d => (d && (d.msg ? String(d.msg) : JSON.stringify(d))) || '').join('; ');
    }
    return String(detail);
  }

  learnBtn.addEventListener('click', async () => {
    const raw = inputEl.value;
    if (!raw.trim()) {
      errorEl.textContent = 'Hãy nhập nội dung bạn muốn học.';
      return;
    }

    errorEl.textContent = '';
    linkEl.innerHTML = '';
    statusEl.textContent = 'Đang bắt đầu...';
    learnBtn.disabled = true;
    learnBtn.classList.add('loading');

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input: raw }),
      });

      if (!response.ok) {
        let detail = '';
        try { detail = formatDetail((await response.json()).detail); } catch (e) {}
        throw new Error(detail || ('Lỗi máy chủ (HTTP ' + response.status + ')'));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) continue;
          let event;
          try { event = JSON.parse(line); } catch (e) { continue; }
          if (event.ping) continue;
          if (event.stage) statusEl.textContent = STAGES[event.stage] || event.stage;
          if (event.error) throw new Error(event.error);
          if (event.done) {
            statusEl.textContent = 'Xong.';
            const a = document.createElement('a');
            a.href = event.link;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = event.link;
            linkEl.innerHTML = '';
            linkEl.appendChild(a);
          }
        }
      }
    } catch (err) {
      errorEl.textContent = err.message || 'Đã xảy ra lỗi.';
      statusEl.textContent = '';
      linkEl.innerHTML = '';
    } finally {
      learnBtn.disabled = false;
      learnBtn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
